<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - HubX</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body{background:#0f0f0f;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}
        .login-box{background:#fff;width:90%;max-width:380px;padding:30px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
        .login-box h2{text-align:center;font-weight:900;margin-bottom:5px}.login-box h2 span{color:#ff0000}
        .login-box p{text-align:center;color:#888;font-size:13px;margin-bottom:25px}
        .login-box input{width:100%;padding:13px 15px;border:1px solid #ddd;border-radius:10px;margin-bottom:15px;outline:none;font-size:14px}
        .login-box input:focus{border-color:#111}
        #loginBtn{width:100%;padding:13px;background:#111;color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer}
        #errorMsg{color:#ff0000;font-size:12px;text-align:center;margin-top:12px;display:none;background:#ffeaea;padding:8px;border-radius:6px}
    </style>
</head>
<body>
    <div class="login-box">
        <h2><span>HUBX</span> ADMIN</h2>
        <p>Only admin can login here</p>
        <input type="email" id="adminEmail" placeholder="Admin Email">
        <input type="password" id="adminPass" placeholder="Password">
        <button id="loginBtn">Login to Dashboard</button>
        <p id="errorMsg"></p>
    </div>

    <script>
        // CONFIG সরাসরি এখানেই - কোনো বাইরের ফাইল লাগবে না
        const firebaseConfig = {
          apiKey: "AIzaSyBQu8cmBIEsSBIsvSsvXH3jGYjopWnf5pM",
          authDomain: "hubx-viral.firebaseapp.com",
          databaseURL: "https://hubx-viral-default-rtdb.firebaseio.com",
          projectId: "hubx-viral",
          storageBucket: "hubx-viral.firebasestorage.app",
          messagingSenderId: "694752071521",
          appId: "1:694752071521:web:79603b500368f90070ff20",
          measurementId: "G-TX4ZP9P6NB"
        };
        firebase.initializeApp(firebaseConfig);

        const emailInput = document.getElementById('adminEmail');
        const passInput = document.getElementById('adminPass');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        firebase.auth().onAuthStateChanged((user) => {
            if (user) checkAdmin(user.uid);
        });

        loginBtn.addEventListener('click', () => {
            const email = emailInput.value.trim();
            const pass = passInput.value.trim();
            if (!email || !pass) return showError("Email & Password লিখো");
            loginBtn.innerText = "Checking..."; loginBtn.disabled = true; errorMsg.style.display="none";
            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then(cred => checkAdmin(cred.user.uid))
                .catch(err => { showError(err.message); resetBtn(); });
        });

        function checkAdmin(uid) {
            firebase.firestore().collection('admins').doc(uid).get()
                .then(doc => {
                    if (doc.exists && doc.data().role === "admin") {
                        window.location.href = "admin-dashboard.html";
                    } else {
                        firebase.auth().signOut();
                        showError("তুমি Admin না!");
                        resetBtn();
                    }
                }).catch((e) => { console.log(e); showError("Rules Error: "+e.message); resetBtn(); });
        }
        function showError(m){errorMsg.style.display="block"; errorMsg.innerText=m;}
        function resetBtn(){loginBtn.innerText="Login to Dashboard"; loginBtn.disabled=false;}
    </script>
</body>
</html>
