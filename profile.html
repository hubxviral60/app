<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - HubX Viral</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- SweetAlert2 CSS & JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Firebase App, Auth & Firestore Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}
        body{background:#0f0f0f;color:#fff;padding-bottom:70px}
        #mainHeader{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0f0f0f;border-bottom:1px solid #303030}
        .logo{font-size:20px;font-weight:900}.logo span{background:#ff0000;padding:2px 6px;border-radius:4px;margin-right:4px}
        #premiumStatusHead{background:#272727;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer}

        .profile-container{padding:20px 16px;max-width:600px;margin:0 auto}
        .profile-card{background:#181818;border:1px solid #282828;border-radius:12px;padding:20px;text-align:center;margin-bottom:20px}
        .profile-avatar{font-size:50px;color:#aaa;background:#252525;width:90px;height:90px;line-height:90px;border-radius:50%;margin:0 auto 12px}
        .profile-title{font-size:18px;font-weight:600;margin-bottom:4px}
        .profile-uid{font-size:13px;color:#888;word-break:break-all;margin-bottom:15px}
        
        .status-badge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;margin-bottom:15px}
        .status-free{background:#272727;color:#aaa}
        .status-premium{background:#332b00;color:#ffcc00;border:1px solid #ffcc0044}

        .info-box{background:#212121;border-radius:8px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
        .info-box span:last-child{font-weight:600;color:#ddd}

        .action-btn{display:block;width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none;transition:0.2s}
        .btn-primary{background:#ff0000;color:#fff}
        .btn-primary:hover{background:#cc0000}
        .btn-secondary{background:#333;color:#fff}
        .btn-secondary:hover{background:#444}
        .btn-danger{background:#331111;color:#ff4444;border:1px solid #ff444444}
        .btn-danger:hover{background:#441515}

        #bottomNav{position:fixed;bottom:0;left:0;width:100%;height:65px;background:#212121;border-top:1px solid #303030;display:flex;justify-content:space-around;align-items:center;z-index:200}
        .nav-item{background:none;border:none;color:#aaa;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;cursor:pointer;flex:1;padding:8px 0;text-decoration:none}
        .nav-item i{font-size:20px}.nav-item.active{color:#fff}
    </style>
</head>
<body>

    <header id="mainHeader">
        <div class="logo"><span>HUBX</span> VIRAL</div>
        <div id="premiumStatusHead" onclick="location.href='task.html'"><i class="fa-solid fa-lock"></i> Free User</div>
    </header>

    <div class="profile-container">
        <!-- লগইন করা থাকলে এই প্রোফাইল কার্ড এবং লগআউট বাটন দেখাবে -->
        <div id="userProfileCard" class="profile-card">
            <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
            <h2 class="profile-title" id="userNameText">ইউজার অ্যাকাউন্ট</h2>
            <div class="profile-uid" id="userUidText">UID: Loading...</div>
            
            <div id="statusBadgeContainer">
                <span class="status-badge status-free" id="statusBadgeLabel"><i class="fa-solid fa-lock"></i> Free User</span>
            </div>

            <div class="info-box">
                <span>অ্যাকাউন্ট টাইপ</span>
                <span id="accountTypeVal">ফ্রি ইউজার</span>
            </div>
            <div class="info-box">
                <span>প্রিমিয়াম মেয়াদ শেষ</span>
                <span id="premiumExpiryVal">প্রযোজ্য নয়</span>
            </div>
            <div class="info-box">
                <span>আজকের টাস্ক প্রোগ্রেস</span>
                <span id="taskProgressVal">0 / 7 Completed</span>
            </div>

            <a href="task.html" class="action-btn btn-primary"><i class="fa-solid fa-list-check" style="margin-right:6px;"></i> প্রিমিয়াম আনলক / টাস্ক পেজ</a>
            
            <!-- লগআউট বাটন -->
            <button onclick="handleLogout()" class="action-btn btn-danger"><i class="fa-solid fa-right-from-bracket" style="margin-right:6px;"></i> লগআউট করুন</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav id="bottomNav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="wishlist.html" class="nav-item">
            <i class="fa-solid fa-heart"></i>
            <span>Wishlist</span>
        </a>
        <a href="task.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Task</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Firebase Initialization & Logic Script -->
    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyBQu8cmBIEsSBIsvSsvXH3jGYjopWnf5pM", 
            authDomain: "hubx-viral.firebaseapp.com", 
            projectId: "hubx-viral", 
            storageBucket: "hubx-viral.firebasestorage.app", 
            messagingSenderId: "694752071521", 
            appId: "1:694752071521:web:79603b500368f90070ff20" 
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
            .catch((error) => {
                console.error("Persistence error:", error);
            });

        // ইউজার লগইন করা না থাকলে সরাসরি login.html এ রিডাইরেক্ট করবে
        auth.onAuthStateChanged((user) => {
            if (user && !user.isAnonymous) {
                document.getElementById('userUidText').innerText = `UID: ${user.uid}`;
                document.getElementById('userNameText').innerText = user.displayName || user.email || "ইউজার";

                loadUserData(user.uid);
            } else {
                window.location.href = "login.html";
            }
        });

        // ইউজারের ডাটা লোড করা
        function loadUserData(uid) {
            db.collection("users").doc(uid).onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    const premiumUntil = data.premiumUntil ? data.premiumUntil.toDate() : null;
                    const now = new Date();

                    if (premiumUntil && premiumUntil > now) {
                        document.getElementById('premiumStatusHead').innerHTML = `<i class="fa-solid fa-crown" style="color:#ffcc00;"></i> Premium Active`;
                        document.getElementById('premiumStatusHead').style.background = "#332b00";
                        document.getElementById('statusBadgeContainer').innerHTML = `<span class="status-badge status-premium"><i class="fa-solid fa-crown"></i> Premium Active</span>`;
                        document.getElementById('accountTypeVal').innerText = "প্রিমিয়াম মেম্বার";
                        document.getElementById('premiumExpiryVal').innerText = premiumUntil.toLocaleString('bn-BD', { 
                            day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' 
                        });
                    } else {
                        document.getElementById('premiumStatusHead').innerHTML = `<i class="fa-solid fa-lock"></i> Free User`;
                        document.getElementById('premiumStatusHead').style.background = "#272727";
                        document.getElementById('statusBadgeContainer').innerHTML = `<span class="status-badge status-free"><i class="fa-solid fa-lock"></i> Free User</span>`;
                        document.getElementById('accountTypeVal').innerText = "ফ্রি ইউজার";
                        document.getElementById('premiumExpiryVal').innerText = "প্রযোজ্য নয়";
                    }

                    let completedCount = 0;
                    if (data.completedAds && Array.isArray(data.completedAds)) {
                        completedCount = data.completedAds.length;
                    } else if (data.completedTasks && Array.isArray(data.completedTasks)) {
                        completedCount = data.completedTasks.length;
                    }
                    
                    document.getElementById('taskProgressVal').innerText = `${completedCount} / 7 Completed`;
                }
            });
        }

        // লগআউট ফাংশন
        function handleLogout() {
            Swal.fire({
                title: 'লগআউট করতে চান?',
                text: 'আপনি কি আপনার অ্যাকাউন্ট থেকে বের হয়ে যেতে চান?',
                icon: 'warning',
                background: '#1a1a1a',
                color: '#fff',
                showCancelButton: true,
                confirmButtonColor: '#ff0000',
                cancelButtonColor: '#333',
                confirmButtonText: 'হ্যাঁ, লগআউট',
                cancelButtonText: 'বাতিল'
            }).then((result) => {
                if (result.isConfirmed) {
                    auth.signOut().then(() => {
                        location.href = 'login.html';
                    }).catch((error) => {
                        console.error("Logout error:", error);
                    });
                }
            });
        }
    </script>

</body>
</html>
