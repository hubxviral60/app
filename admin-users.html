<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users - HubX Viral</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- SweetAlert2 CSS & JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Firebase App, Auth & Firestore Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}
        body{background:#0f0f0f;color:#fff;padding-bottom:30px}
        
        .header{padding:16px;background:#181818;border-bottom:1px solid #333;display:flex;align-items:center;position:relative}
        .back-btn{color:#ffcc00;font-size:18px;text-decoration:none;position:absolute;left:16px;background:#252525;padding:8px 12px;border-radius:8px;border:1px solid #333;display:flex;align-items:center;justify-content:center}
        .header-title{width:100%;text-align:center}
        .header-title h2{font-size:18px;margin-bottom:4px;color:#ffcc00}
        .header-title p{font-size:13px;color:#aaa}
        
        .container{padding:16px}

        /* স্ট্যাটিস্টিকস বক্স */
        .stats-box{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-bottom:15px}
        .stat-card{background:#1a1a1a;border:1px solid #2a2a2a;padding:12px;border-radius:10px;text-align:center}
        .stat-card h3{font-size:18px;color:#ffcc00;margin-bottom:4px}
        .stat-card p{font-size:11px;color:#aaa}

        /* সার্চ বক্স */
        .search-box{margin-bottom:15px}
        .search-box input{width:100%;padding:12px 15px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#fff;outline:none;font-size:14px}
        .search-box input:focus{border-color:#ffcc00}
        
        .user-card{background:#1a1a1a;border:1px solid #2a2a2a;padding:14px;border-radius:10px;margin-bottom:12px}
        .user-info h4{font-size:15px;color:#fff;margin-bottom:4px}
        .user-info p{font-size:12px;color:#aaa;margin-bottom:2px;word-break:break-all}
        
        .badge{display:inline-block;padding:3px 8px;font-size:10px;border-radius:4px;font-weight:600;margin-top:6px}
        .badge.free{background:#333;color:#aaa}
        .badge.premium{background:#ffcc00;color:#000}
        
        .action-buttons{display:flex;gap:6px;margin-top:10px;border-top:1px solid #2a2a2a;padding-top:10px}
        .btn{flex:1;padding:8px 4px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px}
        .btn-view{background:#2196F3;color:#fff}
        .btn-premium{background:#ffcc00;color:#000}
        .btn-free{background:#555;color:#fff}
        .btn-delete{background:#ff3b30;color:#fff}
    </style>
</head>
<body>

    <div class="header">
        <a href="admin-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="header-title">
            <h2><i class="fa-solid fa-users-gear"></i> ইউজার ম্যানেজমেন্ট</h2>
            <p>সকল রেজিস্টার্ড ইউজারের তালিকা এবং কন্ট্রোল প্যানেল</p>
        </div>
    </div>

    <!-- মূল কন্টেন্ট যা সিকিউরিটি চেকের পর শো করবে -->
    <div class="container" id="mainContainer" style="display:none;">
        
        <!-- অ্যানালিটিক্স কাউন্টার -->
        <div class="stats-box">
            <div class="stat-card">
                <h3 id="totalUsersCount">0</h3>
                <p>মোট ইউজার</p>
            </div>
            <div class="stat-card">
                <h3 id="premiumUsersCount" style="color:#ffcc00;">0</h3>
                <p>প্রিমিয়াম</p>
            </div>
            <div class="stat-card">
                <h3 id="freeUsersCount" style="color:#aaa;">0</h3>
                <p>ফ্রি ইউজার</p>
            </div>
        </div>

        <!-- সার্চ বার -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="নাম বা ইমেইল দিয়ে সার্চ করুন..." onkeyup="filterUsers()">
        </div>

        <div id="userList">
            <p style="text-align:center; color:#777; padding:20px;">লোড হচ্ছে...</p>
        </div>
    </div>

    <!-- সিকিউরিটি লোডিং মেসেজ -->
    <div id="securityLoading" style="text-align:center; padding:60px 20px;">
        <p style="color:#aaa; font-size:14px;">সিকিউরিটি যাচাই করা হচ্ছে...</p>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyBQu8cmBIEsSBIsvSsvXH3jGYjopWnf5pM", 
            authDomain: "hubx-viral.firebaseapp.com", 
            projectId: "hubx-viral", 
            storageBucket: "hubx-viral.firebasestorage.app", 
            messagingSenderId: "694752071521", 
            appId: "1:694752071521:web:79603b500368f90070ff20" 
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.error);

        let allUsersData = []; // সব ইউজারের ডেটা ক্যাশ করে রাখার জন্য

        // অ্যাডমিন সিকিউরিটি ও অথ স্টেট ভ্যালিডেশন
        auth.onAuthStateChanged(async (user) => {
            if (!user || user.isAnonymous) {
                redirectToLogin();
                return;
            }

            try {
                const adminDoc = await db.collection("admins").doc(user.uid).get();
                if (!adminDoc.exists) {
                    await auth.signOut();
                    redirectToLogin();
                    return;
                }

                document.getElementById('securityLoading').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                loadAllUsers();

            } catch (err) {
                console.error("Security check error:", err);
                redirectToLogin();
            }
        });

        function redirectToLogin() {
            document.getElementById('securityLoading').innerHTML = `
                <div style="text-align:center; padding:30px 20px;">
                    <p style="color:#ff3b30; font-size:14px; margin-bottom:12px;">অ্যাক্সেস ডিনাইয়েড! এই পেজটি শুধুমাত্র অ্যাডমিনদের জন্য।</p>
                    <a href="admin-login.html" style="background:#ff0000; color:#fff; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:600; display:inline-block;">অ্যাডমিন লগইন করুন</a>
                </div>
            `;
        }

        function loadAllUsers() {
            db.collection("users").onSnapshot(snapshot => {
                allUsersData = [];
                if(snapshot.empty) {
                    document.getElementById('userList').innerHTML = `<p style="text-align:center; color:#777;">কোনো ইউজার পাওয়া যায়নি!</p>`;
                    updateStats(0, 0, 0);
                    return;
                }

                let premiumCount = 0;
                let freeCount = 0;
                const now = new Date();

                snapshot.forEach(doc => {
                    const u = doc.data();
                    const uid = doc.id;
                    let isPremium = false;
                    
                    if(u.premiumUntil) {
                        const expiry = u.premiumUntil.toDate ? u.premiumUntil.toDate() : new Date(u.premiumUntil);
                        if(expiry > now) isPremium = true;
                    }

                    if(isPremium) premiumCount++;
                    else freeCount++;

                    allUsersData.push({ uid, u, isPremium });
                });

                updateStats(allUsersData.length, premiumCount, freeCount);
                renderUserList(allUsersData);
            });
        }

        function renderUserList(users) {
            let html = "";
            if(users.length === 0) {
                document.getElementById('userList').innerHTML = `<p style="text-align:center; color:#777; padding:20px;">কোনো মিল পাওয়া যায়নি!</p>`;
                return;
            }

            users.forEach(item => {
                const u = item.u;
                const uid = item.uid;
                const isPremium = item.isPremium;
                const name = u.name || u.displayName || "নামহীন ইউজার";
                const email = u.email || "ইমেইল পাওয়া যায়নি";

                html += `
                    <div class="user-card">
                        <div class="user-info">
                            <h4>${name}</h4>
                            <p><i class="fa-solid fa-envelope"></i> ${email}</p>
                            <p><i class="fa-solid fa-id-badge"></i> ID: ${uid}</p>
                            <div>
                                ${isPremium ? '<span class="badge premium"><i class="fa-solid fa-crown"></i> Lifetime / Active Premium</span>' : '<span class="badge free">Free User</span>'}
                            </div>
                        </div>
                        <div class="action-buttons">
                            <button class="btn btn-view" onclick='viewUserData(${JSON.stringify(u)}, "${uid}")'>
                                <i class="fa-solid fa-eye"></i> ডাটা
                            </button>
                            <button class="btn btn-premium" onclick='makeLifetimePremium("${uid}")' title="প্রিমিয়াম করুন">
                                <i class="fa-solid fa-crown"></i> প্রিমিয়াম
                            </button>
                            <button class="btn btn-free" onclick='makeFreeUser("${uid}")' title="ফ্রি করুন">
                                <i class="fa-solid fa-user"></i> ফ্রি
                            </button>
                            <button class="btn btn-delete" onclick='deleteUser("${uid}")' title="ডিলিট করুন">
                                <i class="fa-solid fa-trash"></i> ডিলিট
                            </button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('userList').innerHTML = html;
        }

        function updateStats(total, premium, free) {
            document.getElementById('totalUsersCount').innerText = total;
            document.getElementById('premiumUsersCount').innerText = premium;
            document.getElementById('freeUsersCount').innerText = free;
        }

        // রিয়েল-টাইম সার্চ ফিল্টার ফাংশন
        function filterUsers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsersData.filter(item => {
                const name = (item.u.name || item.u.displayName || "").toLowerCase();
                const email = (item.u.email || "").toLowerCase();
                const uid = item.uid.toLowerCase();
                return name.includes(query) || email.includes(query) || uid.includes(query);
            });
            renderUserList(filtered);
        }

        // ইউজারের সম্পূর্ণ ডাটা পপআপে দেখানো
        function viewUserData(userData, uid) {
            let dataString = JSON.stringify(userData, null, 2);
            Swal.fire({
                title: 'ইউজার ডিটেইলস',
                html: `<pre style="text-align:left; background:#111; color:#0f0; padding:10px; border-radius:6px; max-height:250px; overflow-y:auto; font-size:11px;">${dataString}</pre>`,
                background: '#1a1a1a',
                color: '#fff',
                confirmButtonColor: '#ff0000',
                confirmButtonText: 'বন্ধ করুন'
            });
        }

        // আজীবনের জন্য প্রিমিয়াম করা
        function makeLifetimePremium(uid) {
            Swal.fire({
                title: 'নিশ্চিত করুন?',
                text: 'এই ইউজারকে কি আজীবনের জন্য প্রিমিয়াম দিতে চান?',
                icon: 'question',
                background: '#1a1a1a',
                color: '#fff',
                showCancelButton: true,
                confirmButtonColor: '#ffcc00',
                cancelButtonColor: '#333',
                confirmButtonText: 'হ্যা, প্রিমিয়াম করুন',
                cancelButtonText: 'বাতিল'
            }).then((result) => {
                if (result.isConfirmed) {
                    const lifetimeDate = new Date('2050-12-31T23:59:59');
                    
                    db.collection("users").doc(uid).update({
                        premiumUntil: firebase.firestore.Timestamp.fromDate(lifetimeDate)
                    }).then(() => {
                        Swal.fire({
                            title: 'সফল!',
                            text: 'ইউজারকে সফলভাবে আজীবনের প্রিমিয়াম দেওয়া হয়েছে।',
                            icon: 'success',
                            background: '#1a1a1a',
                            color: '#fff',
                            confirmButtonColor: '#ff0000'
                        });
                    }).catch(err => {
                        console.error(err);
                        Swal.fire('ত্রুটি!', 'অপারেশন সম্পন্ন করা যায়নি।', 'error');
                    });
                }
            });
        }

        // ফ্রি ইউজারে রূপান্তর করা (premiumUntil ফিল্ড রিমোভ বা পাস্ট ডেট করে দেওয়া)
        function makeFreeUser(uid) {
            Swal.fire({
                title: 'নিশ্চিত করুন?',
                text: 'এই ইউজারের প্রিমিয়াম স্ট্যাটাস বাতিল করে কি ফ্রি ইউজার করতে চান?',
                icon: 'warning',
                background: '#1a1a1a',
                color: '#fff',
                showCancelButton: true,
                confirmButtonColor: '#ff3b30',
                cancelButtonColor: '#333',
                confirmButtonText: 'হ্যাঁ, ফ্রি করুন',
                cancelButtonText: 'বাতিল'
            }).then((result) => {
                if (result.isConfirmed) {
                    db.collection("users").doc(uid).update({
                        premiumUntil: firebase.firestore.FieldValue.delete()
                    }).then(() => {
                        Swal.fire({
                            title: 'সফল!',
                            text: 'ইউজারকে সফলভাবে ফ্রি User-এ পরিবর্তন করা হয়েছে।',
                            icon: 'success',
                            background: '#1a1a1a',
                            color: '#fff',
                            confirmButtonColor: '#ff0000'
                        });
                    }).catch(err => {
                        console.error(err);
                        Swal.fire('ত্রুটি!', 'অপারেশন সম্পন্ন করা যায়নি।', 'error');
                    });
                }
            });
        }

        // ইউজার ডিলিট করা
        function deleteUser(uid) {
            Swal.fire({
                title: 'আপনি কি নিশ্চিত?',
                text: 'এই ইউজারের ডাটা ফায়ারবেস থেকে স্থায়ীভাবে মুছে যাবে!',
                icon: 'warning',
                background: '#1a1a1a',
                color: '#fff',
                showCancelButton: true,
                confirmButtonColor: '#ff3b30',
                cancelButtonColor: '#333',
                confirmButtonText: 'হ্যাঁ, ডিলিট করুন',
                cancelButtonText: 'বাতিল'
            }).then((result) => {
                if (result.isConfirmed) {
                    db.collection("users").doc(uid).delete().then(() => {
                        Swal.fire({
                            title: 'ডিলিট হয়েছে!',
                            text: 'ইউজার সফলভাবে মুছে ফেলা হয়েছে।',
                            icon: 'success',
                            background: '#1a1a1a',
                            color: '#fff',
                            confirmButtonColor: '#ff0000'
                        });
                    }).catch(err => {
                        console.error(err);
                        Swal.fire('ত্রুটি!', 'ইউজার ডিলিট করতে সমস্যা হয়েছে।', 'error');
                    });
                }
            });
        }
    </script>
</body>
  </html>
