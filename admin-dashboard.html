<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - HubX Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
        body{background:#f5f5f7;color:#111; display:none;}
        .admin-header{height:65px;background:#fff;border-bottom:1px solid #e5e5e5;display:flex;justify-content:space-between;align-items:center;padding:0 25px;position:sticky;top:0}
        .admin-logo{font-weight:900;font-size:18px}.admin-logo span{color:#ff0000}
        #logoutBtn{background:#111;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer}
        .container{max-width:1100px;margin:0 auto;padding:25px}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px}
        .stat-card{background:#fff;padding:20px;border-radius:16px;border:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
        .stat-info h3{font-size:13px;color:#888;font-weight:500;text-transform:uppercase}
        .stat-info h1{font-size:28px;margin-top:5px}
        .stat-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
        .icon-video{background:#ffeaea;color:#ff0000}
        .icon-user{background:#eaf0ff;color:#2f67ff}
        .icon-premium{background:#eafff0;color:#00c853}
        .action-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
        .action-card{background:#fff;padding:25px;border-radius:16px;border:1px solid #eee;text-decoration:none;color:#111;transition:0.2s;display:flex;flex-direction:column;gap:15px}
        .action-card:hover{transform:translateY(-4px);box-shadow:0 10px 20px rgba(0,0,0,0.07);border-color:#111}
        .action-card i{font-size:24px;width:50px;height:50px;background:#111;color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center}
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="admin-logo"><span>HUBX</span> ADMIN</div>
        <button id="logoutBtn">Logout</button>
    </header>
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-info"><h3>Total Videos</h3><h1 id="totalVideos">0</h1></div><div class="stat-icon icon-video"><i class="fa-solid fa-play"></i></div></div>
            <div class="stat-card"><div class="stat-info"><h3>Total Users</h3><h1 id="totalUsers">0</h1></div><div class="stat-icon icon-user"><i class="fa-solid fa-users"></i></div></div>
            <div class="stat-card"><div class="stat-info"><h3>Premium Users</h3><h1 id="totalPremium">0</h1></div><div class="stat-icon icon-premium"><i class="fa-solid fa-crown"></i></div></div>
        </div>
        <h3 style="margin-bottom:15px;">Manage</h3>
        <div class="action-grid">
            <a href="admin-upload.html" class="action-card"><i class="fa-solid fa-cloud-arrow-up"></i><div><h3>Upload Video</h3><p>নতুন ভিডিও আপলোড করুন</p></div></a>
            <a href="admin-videos.html" class="action-card"><i class="fa-solid fa-film"></i><div><h3>Manage Videos</h3><p>সব ভিডিও দেখুন ও ডিলিট করুন</p></div></a>
            <a href="admin-ads.html" class="action-card"><i class="fa-solid fa-bullhorn"></i><div><h3>Ad Control</h3><p>৫টা Adsterra লিংক সেট করুন</p></div></a>
            <a href="admin-users.html" class="action-card"><i class="fa-solid fa-user-gear"></i><div><h3>User Control</h3><p>ইউজার ও প্রিমিয়াম ম্যানেজ</p></div></a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBQu8cmBIEsSBIsvSsvXH3jGYjopWnf5pM",
          authDomain: "hubx-viral.firebaseapp.com",
          databaseURL: "https://hubx-viral-default-rtdb.firebaseio.com",
          projectId: "hubx-viral",
          storageBucket: "hubx-viral.firebasestorage.app",
          messagingSenderId: "694752071521",
          appId: "1:694752071521:web:79603b500368f90070ff20"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        const db = firebase.firestore();

        firebase.auth().onAuthStateChanged((user) => {
            if (!user) { window.location.href = "admin-login.html"; return; }
            db.collection('admins').doc(user.uid).get()
                .then(doc => {
                    if (doc.exists && doc.data().role === "admin") {
                        document.body.style.display = "block";
                        loadStats();
                    } else {
                        firebase.auth().signOut().then(()=> location.href="admin-login.html");
                    }
                }).catch(() => location.href="admin-login.html");
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            firebase.auth().signOut().then(() => location.href="admin-login.html");
        });

        function loadStats() {
            // ভিডিওর সংখ্যা ফায়ারস্টোর (Firestore) এর 'videos' কালেকশন থেকে রিয়েলটাইমে লোড হবে
            db.collection('videos').onSnapshot(snapshot => {
                document.getElementById('totalVideos').innerText = snapshot.size;
            });

            // ইউজার এবং প্রিমিয়াম ইউজারের সংখ্যা ফায়ারস্টোর থেকে রিয়েলটাইমে লোড হবে
            db.collection('users').onSnapshot(snapshot => {
                let total = snapshot.size;
                let premium = 0;
                const now = new Date();

                snapshot.forEach(doc => {
                    const u = doc.data();
                    let isPremium = false;

                    if (u.premiumUntil) {
                        const expiry = u.premiumUntil.toDate ? u.premiumUntil.toDate() : new Date(u.premiumUntil);
                        if (expiry > now) {
                            isPremium = true;
                        }
                    }

                    if (isPremium) {
                        premium++;
                    }
                });

                document.getElementById('totalUsers').innerText = total;
                document.getElementById('totalPremium').innerText = premium;
            });
        }
    </script>
</body>
</html>
